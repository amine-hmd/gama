<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre et envoyer une photo</title>
    <style>
        body { text-align: center; font-family: Arial; margin-top: 50px; }
        canvas { border: 1px solid #333; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #006400; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #004d00; }
    </style>
</head>
<body>
    <h1>Prendre et envoyer une photo</h1>
    <button id="snap">Prendre la photo</button>
    <br>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const context = canvas.getContext('2d');

        let stream;

        async function setupCamera() {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            return video;
        }

        snap.addEventListener('click', async () => {
            const video = await setupCamera();
            video.addEventListener('loadeddata', async () => {
                // Prendre la photo
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                // Stopper la caméra
                stream.getTracks().forEach(track => track.stop());

                // Convertir le canvas en base64
                const imageData = canvas.toDataURL('image/png');

                // Envoyer la photo au serveur
                const formData = new FormData();
                formData.append('photo', imageData);

                fetch('upload.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => alert(data))
                .catch(err => alert('Erreur: ' + err));
            }, { once: true });
        });
    </script>
</body>
</html>
